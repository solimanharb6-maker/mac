name: Build Supermarket Simulator (Android APK + iPhone/Android Web)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1) Android APK (Buildozer + python-for-android)
  # ---------------------------------------------------------------
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev build-essential ccache libltdl-dev

      - name: Cache Buildozer (SDK/NDK/p4a)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Install Buildozer
        run: pip install --upgrade pip && pip install "Cython<3.0" "setuptools<71" virtualenv buildozer

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: supermarket-android-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log

  # ---------------------------------------------------------------
  # 2) Web build (pygbag / WebAssembly) -> runs on iPhone (iOS 15+) and Android browsers
  # ---------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build with pygbag
        run: |
          pip install pygbag
          mkdir web_src
          cp main.py mobile.py web_src/
          cp -r assets web_src/assets
          python -m pygbag --build web_src

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web_src/build/web

  deploy-web:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
